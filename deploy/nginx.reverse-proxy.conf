# Reverse proxy sample. TLS, domains, and upstreams are operator-owned.
# This file was not executed against a live production host in Prompt 15.

upstream seu_aims_api {
    # Socket.IO Redis adapter is wired in the API; sticky sessions are not required
    # once that adapter is verified in the target environment.
    server api:3001;
}

server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name _;
    # ssl_certificate     /etc/ssl/certs/seu-aims.crt;
    # ssl_certificate_key /etc/ssl/private/seu-aims.key;
    client_max_body_size 25m;

    add_header Strict-Transport-Security "max-age=15552000" always;
    add_header X-Content-Type-Options nosniff always;

    location /api/ {
        proxy_pass http://seu_aims_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location /socket.io/ {
        proxy_pass http://seu_aims_api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location / {
        proxy_pass http://web:80;
        proxy_set_header Host $host;
        add_header Cache-Control "no-store" always;
    }
}
