# Local/staging-shaped stack. This is not a claimed production cloud.
# Do not put secrets in this file. Copy .env.example to .env and fill values.

services:
  mongo:
    image: mongo:7.0.14
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
    command: ["--bind_ip_all"]
    networks: [internal]

  redis:
    image: redis:7.2.7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    networks: [internal]

  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.api
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      NODE_ENV: production
      API_HOST: 0.0.0.0
      API_PORT: 3001
    depends_on:
      - mongo
      - redis
    networks: [internal]
    expose:
      - "3001"

  worker:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.worker
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      NODE_ENV: production
    depends_on:
      - mongo
      - redis
    networks: [internal]

  web:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.web
    restart: unless-stopped
    networks: [internal]
    expose:
      - "80"

  proxy:
    image: nginx:1.27.3-alpine
    restart: unless-stopped
    depends_on:
      - api
      - web
    ports:
      - "8080:80"
    volumes:
      - ./nginx.local.conf:/etc/nginx/conf.d/default.conf:ro
    networks: [internal]

networks:
  internal:

volumes:
  mongo_data:
  redis_data:
